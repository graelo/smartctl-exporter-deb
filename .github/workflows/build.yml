name: Build and Package smartctl-exporter

on:
  push:
    branches: [ main ]
    tags:
      - '*'
  pull_request:
  workflow_dispatch:

env:
  VERSION: 0.14.0
  DEB_ARCH: amd64

jobs:
  build-deb:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
              debhelper-compat \
              dh-golang \
              golang-any \
              golang-github-prometheus-common-dev \
              smartmontools \
              build-essential

      - name: Clone upstream source
        run: |
          git clone https://github.com/prometheus-community/smartctl_exporter.git smartctl-exporter-${{ env.VERSION }}
          cd smartctl-exporter-${{ env.VERSION }}
          git checkout v${{ env.VERSION }}

          tar czvf ../smartctl-exporter_${{ env.VERSION }}.orig.tar.gz --exclude=.git .

          # Copy ALL packaging files including changelog
          cp -a ../debian .

      - name: Build Debian Source Package
        working-directory: ./smartctl-exporter-${{ env.VERSION }}
        env:
          CGO_ENABLED: "0"
        run: |
          dh clean --buildsystem=golang

          echo "::group::Building source package"
          dpkg-buildpackage -S -us -uc
          echo "::endgroup::"

      - name: Build Debian Binary Package
        working-directory: ./smartctl-exporter-${{ env.VERSION }}
        env:
          CGO_ENABLED: "0"
          DH_GOLANG_INSTALL_ALL: "1"
          # DH_GOLANG_INSTALL_EXTRA: vendor/google.golang.org/protobuf/internal/editiondefaults/editions_defaults.binpb vendor/github.com/prometheus/exporter-toolkit/web/landing_page.css vendor/github.com/prometheus/exporter-toolkit/web/landing_page.html

        run: |
          dh clean --buildsystem=golang

          mkdir -p .gopath/src/github.com/prometheus-community
          ln -sfn "$PWD" ".gopath/src/github.com/prometheus-community/smartctl_exporter"
          export GOPATH="$PWD/.gopath"

          go mod tidy
          go mod vendor -v 2>&1 | grep -v 'testdata/'  # Filter out test data

          echo "::group::Building binary package"
          dpkg-buildpackage -b -us -uc
          echo "::endgroup::"

      - name: Prepare CHANGELOG
        run: |
          printf "Changelog:\n" > CHANGELOG.md
          echo '```' >> CHANGELOG.md
          cat debian/changelog >> CHANGELOG.md
          echo '```' >> CHANGELOG.md

      - name: List produced files
        run: |
          ls -alF ${{ github.workspace }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: smartctl-exporter-deb
          path: |
            ${{ github.workspace }}/smartctl-exporter_*.buildinfo
            ${{ github.workspace }}/smartctl-exporter_*.changes
            ${{ github.workspace }}/smartctl-exporter_*.deb
            ${{ github.workspace }}/smartctl-exporter_*.orig.tar.gz
            ${{ github.workspace }}/smartctl-exporter_*.debian.tar.xz
            ${{ github.workspace }}/smartctl-exporter_*.dsc
            ${{ github.workspace }}/CHANGELOG.md

  release:
    name: Create Release
    needs: build-deb
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: smartctl-exporter-deb

      - uses: ncipollo/release-action@v1
        with:
          artifacts: "*.buildinfo,*.changes,*.deb,*.dsc,*.tar.gz,*.tar.xz"
          bodyFile: "CHANGELOG.md"
          token: ${{ secrets.GITHUB_TOKEN }}

