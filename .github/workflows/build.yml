name: Build and Package smartctl-exporter

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

env:
  VERSION: 0.14.0
  DEB_ARCH: amd64

jobs:
  build-deb:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
              debhelper-compat \
              dh-golang \
              golang-go \
              smartmontools \
              build-essential

      - name: Clone upstream source
        run: |
          git clone https://github.com/prometheus-community/smartctl_exporter.git smartctl-exporter-${{ env.VERSION }}
          cd smartctl-exporter-${{ env.VERSION }}
          git checkout v${{ env.VERSION }}

          go mod tidy
          go mod vendor

          # Copy ALL packaging files including changelog
          cp -a ../debian .

      - name: Build binary once
        working-directory: ./smartctl-exporter-${{ env.VERSION }}
        env:
          GOPROXY: "off"
          CGO_ENABLED: "0"   # Disable CGO explicitly
        run: |
          # Single build with module verification
          go build -v -mod=vendor -trimpath -ldflags="-s -w" -o smartctl_exporter

      - name: Build Debian package
        working-directory: ./smartctl-exporter-${{ env.VERSION }}
        run: |
          # Create .orig tarball
          tar czvf ../smartctl-exporter_${{ env.VERSION }}.orig.tar.gz --exclude=.git .

          # Build package without recompiling
          dpkg-buildpackage -us -uc -b

      - name: Prepare CHANGELOG
        run: |
          echo "```" > CHANGELOG.md
          cat debian/changelog >> CHANGELOG.md
          echo "```" >> CHANGELOG.md

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: smartctl-exporter-deb
          path: |
            ${{ github.workspace }}/smartctl-exporter_*.buildinfo
            ${{ github.workspace }}/smartctl-exporter_*.changes
            ${{ github.workspace }}/smartctl-exporter_*.deb
            ${{ github.workspace }}/smartctl-exporter_*.orig.tar.gz
            ${{ github.workspace }}/CHANGELOG.md

  release:
    name: Create Release
    needs: build-deb
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: smartctl-exporter-deb

      - uses: ncipollo/release-action@v1
        with:
          artifacts: "*.buildinfo,*.changes,*.deb,*.tar.gz"
          bodyFile: "CHANGELOG.md"
          token: ${{ secrets.GITHUB_TOKEN }}

